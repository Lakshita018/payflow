# render.yaml — Render Infrastructure-as-Code for the PayFlow auth service.
#
# Docs: https://render.com/docs/blueprint-spec
#
# HOW TO USE
# ----------
# 1. Push this file to your repo root (or a path Render can discover).
# 2. In the Render dashboard → New → Blueprint → point to this repo.
# 3. Render will create the Web Service below automatically.
# 4. Set the environment variables marked as `sync: false` in the Render
#    dashboard (they are secrets — never committed to the repo).
#
# DATABASE
# --------
# This blueprint does NOT create a Render Postgres database because you are
# using Neon (external managed Postgres). Set DATABASE_URL in the dashboard
# to your Neon connection string:
#   postgresql://user:pass@ep-xxx.neon.tech/neondb?sslmode=require
#
# ZERO-DOWNTIME DEPLOYS
# ---------------------
# start.sh runs `prisma migrate deploy` before the server starts.
# Render will only route traffic to the new instance after it passes the
# health check (GET /health → 200), so migrations always complete first.

services:
  - type: web
    name: payflow-auth-service
    runtime: docker
    # Build from the Dockerfile inside the auth-service subdirectory.
    dockerfilePath: services/auth-service/Dockerfile
    dockerContext: services/auth-service
    # Render auto-assigns the PORT env var; the app reads it from config/env.ts.
    # Default is 3001 — Render's proxy handles external HTTPS → internal HTTP.
    healthCheckPath: /health
    # Auto-deploy every time a commit lands on main.
    autoDeploy: true
    # Render's free tier; upgrade to `standard` for production workloads.
    plan: free

    envVars:
      # ── Server ──────────────────────────────────────────────────────────────
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3001
      - key: SERVICE_NAME
        value: auth-service

      # ── Database ─────────────────────────────────────────────────────────────
      # Set this in the Render dashboard — never commit the real connection string.
      - key: DATABASE_URL
        sync: false   # secret — set manually in Render dashboard

      # ── JWT ──────────────────────────────────────────────────────────────────
      # Generate with: node -e "console.log(require('crypto').randomBytes(48).toString('hex'))"
      - key: JWT_ACCESS_SECRET
        sync: false   # secret — set manually in Render dashboard
      - key: JWT_REFRESH_SECRET
        sync: false   # secret — set manually in Render dashboard
      - key: JWT_ACCESS_EXPIRES_IN
        value: 15m
      - key: JWT_REFRESH_EXPIRES_IN
        value: 7d

      # ── Bcrypt ───────────────────────────────────────────────────────────────
      - key: BCRYPT_SALT_ROUNDS
        value: 12

      # ── Logging ──────────────────────────────────────────────────────────────
      - key: LOG_LEVEL
        value: info

      # ── CORS ─────────────────────────────────────────────────────────────────
      # Replace with your deployed frontend URL (e.g. https://payflow.vercel.app).
      - key: CORS_ALLOWED_ORIGINS
        sync: false   # set in dashboard once frontend URL is known

      # ── Rate limiting ─────────────────────────────────────────────────────────
      - key: RATE_LIMIT_AUTH_MAX
        value: 10
      - key: RATE_LIMIT_WINDOW_MS
        value: 900000

      # ── Email / SMTP ──────────────────────────────────────────────────────────
      # All four must be set in the dashboard to enable password-reset emails.
      # Leave unset to disable email sending (reset URLs log to stdout instead).
      - key: SMTP_HOST
        sync: false   # e.g. smtp.gmail.com
      - key: SMTP_PORT
        sync: false   # e.g. 465
      - key: SMTP_USER
        sync: false   # your Gmail address
      - key: SMTP_PASS
        sync: false   # your Gmail App Password (not your account password)
      - key: EMAIL_FROM
        value: PayFlow <no-reply@payflow.io>

      # ── Frontend URL ──────────────────────────────────────────────────────────
      # Used to build the password-reset link in emails.
      # Set to your deployed frontend URL once known.
      - key: FRONTEND_URL
        sync: false   # e.g. https://payflow.vercel.app
