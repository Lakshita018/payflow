# docker-compose.yml — Auth Service local development stack
#
# Services:
#   auth-service  — the compiled Node/Express auth API
#   postgres      — PostgreSQL 16 (persisted via named volume)
#   redis         — Redis 7 (session / token cache)
#
# Usage:
#   docker compose up --build          # first run
#   docker compose up -d               # subsequent runs (detached)
#   docker compose down -v             # tear down + wipe volume
#
# The auth-service reads its config from environment variables defined below.
# Sensitive values (JWT secrets, etc.) should be overridden via a local .env
# file placed next to this compose file — they are kept as safe placeholders here.

services:

  # ── PostgreSQL ─────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: payflow-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: payflow
      POSTGRES_PASSWORD: payflow
      POSTGRES_DB: payflow
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U payflow -d payflow"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Redis ──────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: payflow-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Auth Service ───────────────────────────────────────────────────────────
  auth-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: payflow-auth-service
    restart: unless-stopped
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3001
      SERVICE_NAME: auth-service

      # ── Database ────────────────────────────────────────────────────────────
      # Uses Docker service name "postgres" as the host.
      DATABASE_URL: postgresql://payflow:payflow@postgres:5432/payflow

      # ── Redis ────────────────────────────────────────────────────────────────
      # Uses Docker service name "redis" as the host.
      REDIS_URL: redis://redis:6379

      # ── RabbitMQ ─────────────────────────────────────────────────────────────
      # Placeholder — RabbitMQ is not part of this compose stack yet.
      RABBITMQ_URL: amqp://guest:guest@localhost:5672

      # ── JWT — CHANGE THESE before any real deployment ────────────────────────
      JWT_ACCESS_SECRET: change-me-access-secret-min-32-chars-local
      JWT_REFRESH_SECRET: change-me-refresh-secret-min-32-chars-local
      JWT_ACCESS_EXPIRES_IN: 15m
      JWT_REFRESH_EXPIRES_IN: 7d

      # ── Bcrypt ───────────────────────────────────────────────────────────────
      BCRYPT_SALT_ROUNDS: 12

      # ── Logging ──────────────────────────────────────────────────────────────
      LOG_LEVEL: info

      # ── CORS ─────────────────────────────────────────────────────────────────
      # Extend with your frontend origin in production.
      CORS_ALLOWED_ORIGINS: ""

      # ── Rate Limiting ─────────────────────────────────────────────────────────
      RATE_LIMIT_AUTH_MAX: 10
      RATE_LIMIT_WINDOW_MS: 900000

# ── Volumes ────────────────────────────────────────────────────────────────────
volumes:
  postgres-data:
    driver: local
